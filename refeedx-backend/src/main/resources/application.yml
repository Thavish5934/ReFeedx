server:
  port: 8080

spring:
  application:
    name: refeedx-backend

  datasource:
    url: jdbc:mysql://localhost:3306/refeedx_db?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
    username: root
    password: Thavish@5934
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # 'update' is convenient for development. Switch to 'validate' once the
      # schema is stable, and you're managing migrations deliberately.
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

# ---- ReFeedX application-specific settings ----
app:
  jwt:
    # Override these with real environment variables outside of local dev.
    secret: ${JWT_SECRET:change-this-to-a-long-random-secret-in-production-please-1234567890}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}   # 24 hours

  admin:
    # The single Admin account is seeded on first boot (see AdminSeedConfig).
    # There is no public registration path for ADMIN.
    email: ${ADMIN_EMAIL:admin@refeedx.com}
    password: ${ADMIN_PASSWORD:Admin@123}
    name: ${ADMIN_NAME:ReFeedX Admin}
